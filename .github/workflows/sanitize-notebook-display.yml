name: Sanitize notebook display

on:
  push:
    branches:
      - sanitize-notebook-display

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sanitize-notebook-display

      - name: Hide identifiers from the notebook preview
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('Predicting Credit Scores Using Demographic and Financial Data.ipynb')
          with path.open('r', encoding='utf-8') as f:
              nb = json.load(f)

          matches = []
          for i, cell in enumerate(nb.get('cells', [])):
              source = ''.join(cell.get('source', []))
              if 'display(train_df.head())' in source:
                  matches.append(i)

          if matches != [5]:
              raise RuntimeError(f'Expected the preview in cell 5 only; found {matches}')

          cell = nb['cells'][5]
          source = ''.join(cell['source'])
          source = source.replace(
              'display(train_df.head())',
              'display(train_df.drop(columns=["ID", "Customer_ID", "Name", "SSN"], errors="ignore").head())'
          )
          cell['source'] = source.splitlines(keepends=True)

          # Remove only the previously saved dataframe preview, which contains identifier values.
          # All other saved EDA output in this cell is preserved.
          outputs = cell.get('outputs', [])
          kept = []
          removed = 0
          for output in outputs:
              payload = json.dumps(output, ensure_ascii=False)
              if output.get('output_type') == 'display_data' and ('821-00-0265' in payload or 'Aaron Maashoh' in payload):
                  removed += 1
                  continue
              kept.append(output)
          if removed != 1:
              raise RuntimeError(f'Expected to remove exactly one saved preview; removed {removed}')
          cell['outputs'] = kept

          rendered = json.dumps(nb, ensure_ascii=False)
          if '821-00-0265' in rendered or 'Aaron Maashoh' in rendered:
              raise RuntimeError('Identifier values remain in the notebook after cleanup')

          with path.open('w', encoding='utf-8') as f:
              json.dump(nb, f, indent=1, ensure_ascii=False)
              f.write('\n')
          PY

      - name: Commit the sanitized notebook and remove this temporary workflow
        run: |
          rm .github/workflows/sanitize-notebook-display.yml
          git config user.name "Alex Reifel"
          git config user.email "97902327+alexreifel@users.noreply.github.com"
          git add "Predicting Credit Scores Using Demographic and Financial Data.ipynb" .github/workflows/sanitize-notebook-display.yml
          git commit -m "Hide identifiers in notebook preview"
          git push origin sanitize-notebook-display
